# Guandan Dr.GRPO v1 — refine the SFT LoRA (checkpoint-9250) against DanZero.
# Recipe: Dr.GRPO advantage (no std) + Clip-Higher + small KL to frozen SFT.
# Consumed by rl/train_grpo.py.

# ---- model / RL start ----
model_name_or_path: Qwen/Qwen2.5-14B-Instruct
adapter_name_or_path: weights/checkpoint-9250   # SFT LoRA, 65.7% vs AI4Card
attn_implementation: flash_attention_2
gradient_checkpointing: true
max_seq_len: 4096

# ---- optimization ----
learning_rate: 1.0e-6        # DAPO constant lr
max_grad_norm: 1.0
max_steps: 500               # v1: validate direction before scaling
save_steps: 50
micro_batch_size: 4          # per-GPU decisions per forward
loss_norm_const: 256         # Dr.GRPO length-free denominator (== max_new_tokens)
output_dir: runs/grpo_v1

# ---- Dr.GRPO loss knobs ----
loss:
  beta: 0.01                 # KL scheme A: small leash to frozen SFT
  epsilon: 0.20              # clip low  (eps_low)
  epsilon_high: 0.28         # Clip-Higher (DAPO), curbs entropy collapse

# ---- rollout ----
rollout:
  opponent: danzero          # v1 opponent (deterministic strong AI)
  our_seats: [0, 2]          # policy plays both teammate seats (2x data)
  num_deals_per_batch: 32    # deals collected per training step
  temperature: 0.8           # exploration temperature for our seats

# ---- vLLM sync (runtime LoRA hot-swap) ----
api_port: 8552
vllm_lora_name: guandan
